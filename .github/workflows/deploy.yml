name: Deploy to GitHub Pages

# REQUIRED SETTING: Settings -> Pages -> Source must be "GitHub Actions".
# If it is left on "Deploy from a branch", GitHub also runs its Jekyll builder
# on every push. That builder renders the repository root — which has no
# index.html, so README.md becomes the home page — and deploys it in parallel
# with this workflow. Both publish an artifact named github-pages, so whichever
# finishes last is what visitors get, and the site flips between the real thing
# and the README. This cannot be fixed from here: updating the Pages source
# needs repository admin rights, which GITHUB_TOKEN does not have (the API
# returns 403 "Resource not accessible by integration").

on:
  push:
    # main is the default branch, which is the only branch the github-pages
    # environment accepts deployments from.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to see whether the branch builder is still running (see the deploy job).
  actions: read

# Let a running deploy finish, but only keep the newest queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A missing or misnamed key is otherwise invisible: the site still builds
      # and still takes orders, but silently falls back to WhatsApp. This prints
      # whether a backend is configured without revealing the key itself.
      - name: Check order backend
        env:
          WEB3FORMS: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY || vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
          ORDERS_API: ${{ secrets.NEXT_PUBLIC_ORDERS_API || vars.NEXT_PUBLIC_ORDERS_API }}
        run: |
          if [ -n "$ORDERS_API" ]; then
            echo "Orders backend: Worker API"
          elif [ -n "$WEB3FORMS" ]; then
            echo "Orders backend: Web3Forms (key length ${#WEB3FORMS})"
          else
            echo "::warning::No order backend configured - the form will fall back to WhatsApp."
          fi

      - name: Build static site
        env:
          # Read from a secret first, falling back to a repository variable, so
          # it works whichever way the key was stored. Note that every
          # NEXT_PUBLIC_ value is inlined into the published JavaScript: storing
          # one as a secret keeps it out of logs and the repo, not out of the
          # bundle. That is fine here — the Web3Forms key only permits
          # submissions and can never read anything back.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY || vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
          NEXT_PUBLIC_ORDERS_API: ${{ secrets.NEXT_PUBLIC_ORDERS_API || vars.NEXT_PUBLIC_ORDERS_API }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
        run: npm run build

      # enablement turns Pages on via the API if it is not already enabled,
      # so a fresh clone of this repo deploys without a manual settings change.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the Pages source is "Deploy from a branch" (see the note at the
      # top of this file), GitHub's Jekyll builder deploys README.md in parallel
      # with us and whichever finishes last is what visitors see. Waiting for it
      # makes us deterministically last instead of winning a coin flip.
      #
      # Once the source is set to "GitHub Actions" that builder stops running,
      # this step finds nothing and exits immediately, so it costs nothing. It
      # can be deleted then.
      - name: Wait for the branch builder, if it is still running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 40); do
            running=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
              | jq '[.workflow_runs[]
                     | select(.name == "pages build and deployment")
                     | select(.status != "completed")] | length')
            if [ "$running" = "0" ]; then
              [ "$attempt" = "1" ] \
                && echo "No branch builder running - Pages is served from this workflow." \
                || echo "Branch builder finished; deploying over it."
              exit 0
            fi
            echo "Branch builder still running ($running); waiting... ($attempt/40)"
            sleep 10
          done
          echo "::warning::Branch builder did not finish in time; deploying anyway. It may overwrite this deployment."

      - id: deployment
        uses: actions/deploy-pages@v4
